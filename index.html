<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoAI 3D Building Digital Twin - Three.js / Deck.gl</title>

  <!-- MapLibre & Deck.gl Core -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --panel-bg: rgba(15, 23, 42, 0.92);
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.3);
      --accent-grad: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; background: #050b14; }
    #map-container { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }

    /* Glassmorphic Cyber GIS Dashboard */
    .dashboard {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      width: 420px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
      padding: 22px;
      color: var(--text-main);
    }

    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    h2 { font-size: 16px; font-weight: 700; color: #fff; }
    
    .badge {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 242, 254, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    p.subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }

    .control-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .control-header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .btn {
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      border: none;
    }
    .btn-accent { background: var(--accent-grad); color: #090d16; }
    .btn-accent:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.06); color: var(--text-main); border: 1px solid var(--border-subtle); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }

    .card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
    .card h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

    .telemetry-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
    .telemetry-row span.val { color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body>

  <div id="map-container"></div>

  <div class="dashboard">
    <div class="header-row">
      <h2>3D Building Twin</h2>
      <span class="badge" id="renderEngineBadge">THREE.JS / DECK.GL</span>
    </div>
    <p class="subtitle">Real-Time Vector Extrusion from GeoPandas Pipeline</p>

    <div class="control-box">
      <div class="control-header">
        <span>3D Vertical Extrusion Scale</span>
        <span id="scaleVal" style="color:var(--accent); font-family:'JetBrains Mono'">1.0x</span>
      </div>
      <input type="range" id="extrusionSlider" min="0.5" max="3.0" step="0.1" value="1.0" />

      <div class="control-header" style="margin-top: 10px;">
        <span>Roof Pitch &amp; Camera Tilt</span>
        <span id="pitchVal" style="color:var(--accent); font-family:'JetBrains Mono'">55°</span>
      </div>
      <input type="range" id="pitchSlider" min="0" max="75" step="5" value="55" />
    </div>

    <div class="btn-grid">
      <button class="btn btn-accent" id="btnRecenter">Reset View</button>
      <button class="btn btn-secondary" id="btnToggleMesh">Wireframe Mode</button>
    </div>

    <div class="card">
      <h4>Telemetry &amp; Extraction Metrics</h4>
      <div class="telemetry-row"><span>Layer Status:</span><span class="val" id="statusVal">Loading Vector GeoJSON...</span></div>
      <div class="telemetry-row"><span>Total Structures:</span><span class="val" id="bldgCountVal">--</span></div>
      <div class="telemetry-row"><span>Avg Building Height:</span><span class="val" id="avgHeightVal">--</span></div>
      <div class="telemetry-row"><span>Projection CRS:</span><span class="val">EPSG:4326 (WGS84)</span></div>
    </div>
  </div>

  <script>
    // 1. Initialize MapLibre Canvas with Satellite Basemap
    const map = new maplibregl.Map({
      container: 'map-container',
      style: {
        version: 8,
        sources: {
          'esri-satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256
          }
        },
        layers: [{
          id: 'esri-satellite-layer',
          type: 'raster',
          source: 'esri-satellite',
          minzoom: 0,
          maxzoom: 22
        }]
      },
      center: [94.635, 26.985],
      zoom: 16.5,
      pitch: 55,
      bearing: -20,
      antialias: true
    });

    let deckOverlay = null;
    let extrusionMultiplier = 1.0;
    let wireframeState = false;
    let geojsonData = null;

    // 2. Fetch the GeoPandas-generated Building GeoJSON
    async function loadBuildingFootprints() {
      try {
        const response = await fetch('buildings.geojson');
        if (!response.ok) {
          throw new Error('buildings.geojson not found in repository root.');
        }
        geojsonData = await response.json();

        // Calculate telemetry metrics
        const total = geojsonData.features.length;
        let sumHeight = 0;
        geojsonData.features.forEach(f => {
          sumHeight += (f.properties.height_m || 6.5);
        });
        const avg = (sumHeight / total).toFixed(1);

        document.getElementById('statusVal').innerText = "Online (Extruded)";
        document.getElementById('bldgCountVal').innerText = `${total} buildings`;
        document.getElementById('avgHeightVal').innerText = `${avg} m`;

        renderDeckExtrusion();

      } catch (err) {
        console.warn(err);
        document.getElementById('statusVal').innerText = "Simulating Demo Twin";
        // Fallback procedural footprint generator if GeoJSON is not yet committed
        generateProceduralBuildings();
      }
    }

    // 3. Render 3D Extrusion using WebGL Shaders (Deck.gl GeoJsonLayer)
    function renderDeckExtrusion() {
      if (!geojsonData) return;

      const buildingLayer = new deck.GeoJsonLayer({
        id: 'geojson-extrusion-layer',
        data: geojsonData,
        extruded: true,
        wireframe: wireframeState,
        getElevation: f => (f.properties.height_m || 6.0) * extrusionMultiplier,
        getFillColor: f => {
          const h = (f.properties.height_m || 6.0);
          // Color ramp based on elevation: Cyan to Electric Blue to Deep Indigo
          if (h > 12) return [0, 242, 254, 230];
          if (h > 6) return [56, 189, 248, 220];
          return [30, 58, 138, 200];
        },
        getLineColor: [0, 242, 254, 255],
        lineWidthMinPixels: 1,
        pickable: true,
        autoHighlight: true,
        highlightColor: [244, 63, 94, 220],
        material: {
          ambient: 0.35,
          diffuse: 0.6,
          shininess: 32,
          specularColor: [255, 255, 255]
        }
      });

      if (!deckOverlay) {
        deckOverlay = new deck.MapboxOverlay({
          layers: [buildingLayer]
        });
        map.addControl(deckOverlay);
      } else {
        deckOverlay.setProps({ layers: [buildingLayer] });
      }
    }

    // Demo twin fallback so the WebUI displays extruded structures immediately
    function generateProceduralBuildings() {
      const demoFeatures = [];
      const centerLon = 94.635;
      const centerLat = 26.985;

      for (let i = 0; i < 45; i++) {
        const offX = (Math.random() - 0.5) * 0.005;
        const offY = (Math.random() - 0.5) * 0.005;
        const w = 0.0003 + Math.random() * 0.0002;
        const h = 0.0003 + Math.random() * 0.0002;
        const heightM = 4.0 + Math.random() * 14.0;

        demoFeatures.push({
          type: "Feature",
          properties: { id: `DEMO-${i+1}`, height_m: heightM, area_m2: Math.round(w * 111000 * h * 111000) },
          geometry: {
            type: "Polygon",
            coordinates: [[
              [centerLon + offX, centerLat + offY],
              [centerLon + offX + w, centerLat + offY],
              [centerLon + offX + w, centerLat + offY + h],
              [centerLon + offX, centerLat + offY + h],
              [centerLon + offX, centerLat + offY]
            ]]
          }
        });
      }

      geojsonData = { type: "FeatureCollection", features: demoFeatures };
      document.getElementById('bldgCountVal').innerText = "45 demo units";
      document.getElementById('avgHeightVal').innerText = "8.2 m";
      renderDeckExtrusion();
    }

    // 4. UI Interactive Controls
    document.getElementById('extrusionSlider').addEventListener('input', (e) => {
      extrusionMultiplier = parseFloat(e.target.value);
      document.getElementById('scaleVal').innerText = extrusionMultiplier.toFixed(1) + "x";
      renderDeckExtrusion();
    });

    document.getElementById('pitchSlider').addEventListener('input', (e) => {
      const pitch = parseInt(e.target.value);
      map.setPitch(pitch);
      document.getElementById('pitchVal').innerText = pitch + "°";
    });

    document.getElementById('btnToggleMesh').addEventListener('click', () => {
      wireframeState = !wireframeState;
      document.getElementById('btnToggleMesh').innerText = wireframeState ? "Solid Mode" : "Wireframe Mode";
      renderDeckExtrusion();
    });

    document.getElementById('btnRecenter').addEventListener('click', () => {
      map.flyTo({ center: [94.635, 26.985], zoom: 16.5, pitch: 55, bearing: -20 });
    });

    map.on('load', () => {
      loadBuildingFootprints();
    });
  </script>
</body>
</html>
