name: Run GeoPandas Building Detection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-buildings:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Geospatial Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy shapely rasterio geopandas

      - name: Execute GeoPandas & Rasterio Detection
        run: |
          python process_cogs.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add buildings.geojson cog_metadata.json || true
          git commit -m "Update spatial layers [skip ci]" || echo "No changes"
          git push
